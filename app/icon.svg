<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="kGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="kGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="kGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="14" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#strokeGrad)" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Stylized Monogram 'K' -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Spine -->
    <path
      d="M 130 115 C 130 101 141 90 155 90 L 185 90 C 199 90 210 101 210 115 L 210 397 C 210 411 199 422 185 422 L 155 422 C 141 422 130 411 130 397 Z"
      fill="url(#kGrad1)"
    />

    <!-- Upper Diagonal Arm -->
    <path
      d="M 195 275 L 328 118 C 337 107 353 107 363 116 L 382 135 C 392 145 391 161 381 172 L 265 295 L 391 420 C 401 430 400 447 389 457 L 368 476 C 358 485 342 484 332 474 L 195 330 Z"
      fill="none"
    />
    
    <!-- Upper Arm -->
    <path
      d="M 205 285 L 325 125 C 334 114 350 113 361 123 L 380 142 C 390 152 389 168 379 179 L 265 295 Z"
      fill="url(#kGrad2)"
    />

    <!-- Lower Arm -->
    <path
      d="M 240 270 L 375 422 C 385 433 384 450 373 460 L 354 477 C 343 487 326 486 316 475 L 195 335 Z"
      fill="url(#kGrad3)"
    />

    <!-- Center Cyber Node / Accent Highlight -->
    <circle cx="230" cy="285" r="14" fill="#38bdf8" />
  </g>
</svg>
